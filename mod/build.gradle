plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '8.12.0'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

// Development only: `-PquickPlay=127.0.0.1:25565` joins a local test server on launch;
// `-PquickPlayWorld=NAME` opens an existing single-player world from mod/run/saves.
// The live acceptance runner also sets `-PdevUsername=NAME` (the offline player name) and
// `-PclientRunDir=PATH` (relative to mod/; a game directory per run, so mod/run/options.txt is never touched).
loom {
    runs {
        client {
            if (project.hasProperty('quickPlay')) programArgs '--quickPlayMultiplayer', project.property('quickPlay')
            if (project.hasProperty('quickPlayWorld')) programArgs '--quickPlaySingleplayer', project.property('quickPlayWorld')
            if (project.hasProperty('devUsername')) programArgs '--username', project.property('devUsername')
            if (project.hasProperty('clientRunDir')) runDir project.property('clientRunDir').toString()
        }
    }
}

// Packaged-jar pre-check (`npm run acceptance:fabric -- --packaged`): Fabric Loader in production mode
// (the official client jar, deobfuscated to intermediary at launch), loading only the jars the runner
// copied from the release archive into `<clientRunDir>/mods`, as a launcher's mods folder would. Nothing
// from this build is added: `mods` is cleared, so the task neither builds nor passes `remapJar`.
// Same properties as the development client. Loom's own xvfb-run wrapper (on by default when CI is set)
// stays off: the runner already runs under Xvfb, and the takeover key presses need that display.
tasks.register('runProductionClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    group = 'fabric'
    description = 'Starts the client in Fabric production mode with the mods in <clientRunDir>/mods.'
    mods.setFrom()
    useXVFB = false
    if (project.hasProperty('quickPlay')) programArgs.addAll('--quickPlayMultiplayer', project.property('quickPlay').toString())
    if (project.hasProperty('devUsername')) programArgs.addAll('--username', project.property('devUsername').toString())
    if (project.hasProperty('clientRunDir')) runDir = file(project.property('clientRunDir').toString())
}
// Resolves what runProductionClient puts on its classpath (Fabric Loader and intermediary for this Minecraft
// version, as detached configurations) so a later offline run has them: `node scripts/gradle.js
// prepareProductionClient --allow-downloads`.
tasks.register('prepareProductionClient') {
    group = 'fabric'
    description = 'Downloads the libraries runProductionClient needs.'
    def production = tasks.named('runProductionClient')
    doLast {
        def files = production.get().classpath.files
        logger.lifecycle("runProductionClient classpath: ${files.size()} files")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation files('../.deps/baritone-api-fabric-1.11.3.jar')
    // Loom does not put this local mod's nested library on the development classpath.
    // The unmodified release jar already includes it for normal launcher installs.
    modRuntimeOnly files('../.deps/nether-pathfinder-1.6.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
test {
    useJUnitPlatform()
    inputs.file('../src/recipes.js')
    systemProperty 'java.io.tmpdir', file('../.runtime/tmp').absolutePath
    doFirst { file('../.runtime/tmp').mkdirs() }
}
// `check` (and so `build`) runs spotlessCheck; `npm run format:mod` applies the formatting.
spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.103.0')
        trimTrailingWhitespace()
        endWithNewline()
    }
}
tasks.withType(JavaExec).configureEach {
    systemProperty 'java.io.tmpdir', file('../.runtime/tmp').absolutePath
    doFirst { file('../.runtime/tmp').mkdirs() }
}
