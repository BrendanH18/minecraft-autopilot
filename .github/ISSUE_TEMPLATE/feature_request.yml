name: Feature request
description: Propose an improvement or a new bounded task.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Please check docs/ROADMAP.md and existing issues before proposing a feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What task are you trying to accomplish, and where does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe success, limits, and how the player should regain control.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
