version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  # Covers what mod/build.gradle declares literally (the fabric-loom plugin) and
  # the Gradle wrapper. scripts/gradle.js reads the wrapper's version, so a
  # wrapper bump needs no other change.
  # Not covered, and updated by hand together: the Minecraft, Yarn, Fabric
  # Loader and Fabric API versions in mod/gradle.properties (Dependabot doesn't
  # resolve them through ${project.*}, and they must move with the Minecraft
  # version), and the Baritone and Fabric API jars that scripts/setup-mod.js
  # and scripts/package-mod.js pin by SHA-256.
  - package-ecosystem: gradle
    directory: /mod
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
