name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly build without caches so broken upstream downloads (Gradle, Minecraft,
  # Fabric, Baritone) show up even when nothing is pushed.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every other run (main,
# schedule, manual) gets its own group, so it is never cancelled or queued.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # .npmrc points the npm cache at .npm-cache; setup-node reads it from npm config.
          cache: npm
      # .github/actionlint.yaml declares the Namespace runner labels.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm start -- demo --smoke

  mod:
    runs-on: namespace-profile-gitrunner
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # scripts/gradle.js keeps GRADLE_USER_HOME in .gradle-user/ and setup downloads
      # into .deps/, so setup-java's Gradle cache would miss them. The key covers the
      # Gradle build files, the wrapper, and the scripts that pin the Baritone and
      # Fabric API jars. Scheduled runs skip the cache to exercise every download.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'schedule'
        with:
          path: |
            .gradle-user/caches
            .gradle-user/wrapper
            .deps
          key: mod-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mod/*.gradle', 'mod/gradle.properties', 'mod/gradle/wrapper/gradle-wrapper.properties', 'scripts/setup-mod.js', 'scripts/package-mod.js') }}
          restore-keys: |
            mod-deps-${{ runner.os }}-${{ runner.arch }}-
      # CI opts into downloads explicitly; local builds stay offline by default.
      - name: Download dependencies and build
        run: |
          node scripts/setup-mod.js --allow-downloads
          node scripts/gradle.js build --allow-downloads
          node scripts/package-mod.js --allow-downloads
      # Rebuild from a clean output with the everyday offline commands to check the
      # "no implicit downloads" rule: gradle.js passes --offline, and setup/package
      # fail instead of fetching if a pinned jar is missing.
      - name: Offline rebuild and verify
        run: |
          rm -rf dist
          node scripts/gradle.js clean
          npm run build:mod
          npm run verify:mod
      # Pull requests still build and verify the bundle but do not upload it, so a
      # full artifact quota cannot fail a PR. Other runs keep it for a week rather
      # than GitHub's 90-day default, since uploads count against this private
      # repo's storage.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minecraft-agent-installation
          path: dist/
          if-no-files-found: error
          retention-days: 7
