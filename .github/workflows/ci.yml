name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm start -- demo --smoke

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # CI opts into downloads explicitly; local builds stay offline by default.
      - run: node scripts/setup-mod.js --allow-downloads
      - run: node scripts/gradle.js build --allow-downloads
      - run: node scripts/package-mod.js --allow-downloads
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-agent-installation
          path: dist/
          if-no-files-found: error
